version: "3.9"

services:
  # ── PostgreSQL 16 ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: gully_db
    environment:
      POSTGRES_USER: gullyuser
      POSTGRES_PASSWORD: gullypass
      POSTGRES_DB: gullydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gullyuser -d gullydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ──────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: gully_backend
    command: >
      sh -c "
        echo 'Waiting for DB...' &&
        python -c 'import time, asyncio; time.sleep(3)' &&
        python seed.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://gullyuser:gullypass@db:5432/gullydb
      SECRET_KEY: dev-secret-gully-stars-2024-change-in-prod
      DEBUG: "true"
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/code
      - ./backend/uploads:/code/uploads

  # ── React Frontend ───────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: gully_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
